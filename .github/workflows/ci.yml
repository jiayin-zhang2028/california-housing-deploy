# CI：每次 push 都自动证明「这条链路还能跑」。
#
# 它挡住的正是最常见的灾难：
#   本机能跑 -> 换台机器 / 半年后 -> 跑不起来 -> 无法复现 -> 交付失败。
#
# 分三步：先训（链路通不通），再测（行为对不对），最后构建镜像（能不能交付）。
#
# 注意：本仓库的**根目录就是项目本身**（没有 housing-deploy 这一层子目录），
# 所以所有路径都相对于仓库根，不要再写 working-directory: housing-deploy。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 训练冒烟（合成数据，不需要 Kaggle 数据集）
        run: python -m src.train --synthetic --max-iter 80

      - name: 单元 + 接口测试
        run: python -m pytest

      - name: 镜像能构建（含 artifacts/）
        run: docker build -t housing-pred:ci .
